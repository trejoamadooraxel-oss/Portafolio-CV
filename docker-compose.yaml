services:

  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_pass
      POSTGRES_DB: airflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_spotify_db_.sql:/docker-entrypoint-initdb.d/init_spotify_db_.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow_user", "-d", "airflow_db"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: ./docker
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/include
    volumes:
      - ./docker/dags_docker:/opt/airflow/dags
      - ./docker/logs_docker:/opt/airflow/logs
      - ./docker/plugins:/opt/airflow/plugins
      - ./Spotify_api:/opt/airflow/include/Spotify_api
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Axl \
          --lastname Dev \
          --role Admin \
          --email admin@example.com || true



  airflow-webserver:
    build:
      context: ./docker
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ./Spotify_api/env_var/varaibles_credential.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/include
    volumes:
      - ./docker/dags_docker:/opt/airflow/dags
      - ./docker/logs_docker:/opt/airflow/logs
      - ./docker/plugins:/opt/airflow/plugins
      - ./Spotify_api:/opt/airflow/include/Spotify_api
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: ./docker
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ./Spotify_api/env_var/varaibles_credential.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/include
    volumes:
      - ./docker/dags_docker:/opt/airflow/dags
      - ./docker/logs_docker:/opt/airflow/logs
      - ./docker/plugins:/opt/airflow/plugins
      - ./Spotify_api:/opt/airflow/include/Spotify_api
    command: scheduler

  fastapi:
    build:
      context: ./docker_fastapi
    container_name: fastapi_app
    env_file:
      - ./Spotify_api/env_var/varaibles_credential.env
    volumes:
      - ./Spotify_api:/app/Spotify_api
    ports:
      - "8000:8000"

volumes:
  postgres_data: