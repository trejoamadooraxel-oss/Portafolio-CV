spotify:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: spotify_analytics
      location: US
      #Se comento la siguiente linea debido a que la autentificacion se manjera con
      #""type": "authorized_user"" en el archivo de gcp_adc.json y  no con una se service acount
      #keyfile: "{{ env_var('DBT_KEYFILE') }}"
      threads: 4